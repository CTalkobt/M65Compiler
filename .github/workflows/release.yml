name: Release

# Prebuilt binaries for a release (#621): for a tag v*, the archives
# src/release/package.sh makes are attached to that tag's GitHub release
# (created as a draft when there is none yet, for the notes to be written
# and published by hand). Run by hand (workflow_dispatch) it only builds:
# the archives are kept as the run's artifacts, nothing is released.
#
#   m65compiler-<version>-linux-x86_64.tar.gz   static (musl), any Linux
#   m65compiler-<version>-linux-arm64.tar.gz    static (musl), any Linux
#   m65compiler-<version>-macos-arm64.tar.gz    Apple clang, system libraries
#   SHA256SUMS
#
# and the Docker images (#625), for linux/amd64 and linux/arm64, are pushed to
# the GitHub Container Registry (by hand they are only built and tried):
#
#   ghcr.io/<owner>/m65compiler:<version>, :latest            the toolchain (src/Docker/Dockerfile)
#   ghcr.io/<owner>/m65compiler:<version>-runtime, :runtime   with xemu (src/Docker/Dockerfile.runtime)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true    # third_party/zlib, the bundled zlib (#620)

      - name: Build and check the static archive
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash src/release/package.sh linux-static "$RUNNER_TEMP/release"

      - name: Keep the archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.runner }}
          path: ${{ runner.temp }}/release/*.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true    # third_party/zlib, the bundled zlib (#620)

      - name: Install GNU make
        run: brew install make

      - name: Build and check the archive
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          MAKE: gmake
          JOBS: 3
        run: bash src/release/package.sh native "$RUNNER_TEMP/release"

      - name: Keep the archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-macos
          path: ${{ runner.temp }}/release/*.tar.gz
          if-no-files-found: error

  # The Docker images (#625): each built on a runner of its architecture and
  # tried (its cc45 builds a program); for a tag, pushed under a tag of that
  # architecture, which docker-publish joins
  docker:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        image: [toolchain, runtime]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true    # third_party/zlib, the bundled zlib (#620)

      - name: Names
        id: n
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          IMAGE: ${{ matrix.image }}
        run: |
          case "$(uname -m)" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; *) echo "unknown architecture"; exit 1 ;; esac
          [ "$IMAGE" = runtime ] && file=src/Docker/Dockerfile.runtime suffix=-runtime || file=src/Docker/Dockerfile suffix=
          {
            echo "file=$file"
            echo "ref=ghcr.io/$(echo "$OWNER" | tr A-Z a-z)/m65compiler:${TAG#v}$suffix-$arch"
            echo "hash=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Build the image
        run: docker build --build-arg GIT_HASH=${{ steps.n.outputs.hash }} -f ${{ steps.n.outputs.file }} -t ${{ steps.n.outputs.ref }} .

      - name: Try the image
        env:
          REF: ${{ steps.n.outputs.ref }}
          HASH: ${{ steps.n.outputs.hash }}
        run: |
          mkdir "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try" && chmod 777 .
          printf '#include <stdio.h>\nint main(void) { printf("hello\\n"); return 0; }\n' > hello.c
          run="docker run --rm -v $PWD:/work --entrypoint sh $REF -c"
          $run 'cc45 --version' | tee version.txt
          grep -q "($HASH)" version.txt
          $run 'cc45 -O2 hello.c -o hello.prg && disk45 create t.d81 && disk45 add t.d81 hello.prg && disk45 list t.d81'
          test -s hello.prg
          if [ "${{ matrix.image }}" = runtime ]; then
              # (no ROM here: the emulator's libraries are all there, and m65run says what is missing)
              $run '! ldd /usr/local/libexec/xmega65 | grep "not found"'
              $run 'm65run hello.prg' 2>&1 | tee run.txt || true
              grep -q "no MEGA65 ROM" run.txt
          fi

      - name: Push the image
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ${{ steps.n.outputs.ref }}

  # Only for a tag: each image's two architectures under one name
  docker-publish:
    if: github.ref_type == 'tag'
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Join the architectures
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          repo=ghcr.io/$(echo "$OWNER" | tr A-Z a-z)/m65compiler
          v=${TAG#v}
          docker buildx imagetools create -t "$repo:$v" -t "$repo:latest" "$repo:$v-amd64" "$repo:$v-arm64"
          docker buildx imagetools create -t "$repo:$v-runtime" -t "$repo:runtime" "$repo:$v-runtime-amd64" "$repo:$v-runtime-arm64"
          docker buildx imagetools inspect "$repo:$v"

  # Only for a tag: the archives and their checksums on the tag's release
  publish:
    if: github.ref_type == 'tag'
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the archives
        uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: release

      - name: Checksums
        run: cd release && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 ||
              gh release create "$TAG" --draft --title "$TAG" --notes "Release notes to follow (CHANGELOG.md)."
          gh release upload "$TAG" release/*.tar.gz release/SHA256SUMS --clobber
