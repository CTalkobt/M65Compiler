name: Compile Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # A clean build with each distribution's compiler (newer GCC, musl, clang):
  # src/test/test_distro_builds.sh, one distribution per job. One of each
  # compiler / C library: debian13 (GCC; also builds the examples), fedora
  # (GCC), fedora-clang (clang), arch (the newest GCC), alpine (musl).
  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [debian13, fedora, fedora-clang, arch, alpine]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build in ${{ matrix.distro }}
        env:
          DISTRO_EXAMPLES: ${{ matrix.distro == 'debian13' && '1' || '0' }}
        run: bash src/test/test_distro_builds.sh ${{ matrix.distro }}

  # macOS (Apple clang, the macOS SDK; #501-#503): the tools and the library
  # build, install, and an installed cc45 started from PATH finds its headers
  # and library from any directory. GNU make from Homebrew (gmake): macOS's
  # own make is 3.81. FUSE is not installed: disk45 is built without mount.
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install GNU make
        run: brew install make

      - name: Build the tools
        run: gmake -j"$(sysctl -n hw.ncpu)" all

      - name: Build the library
        run: gmake lib

      - name: Install and compile from another directory
        run: |
          gmake install PREFIX="$RUNNER_TEMP/m65"
          cd "$RUNNER_TEMP"
          printf '#include <stdio.h>\nint main(void) { puts("hello"); return 0; }\n' > hello.c
          PATH="$RUNNER_TEMP/m65/bin:$PATH" cc45 -O2 hello.c -o hello.prg
          test -s hello.prg
          echo "an installed cc45 from PATH built hello.prg ($(wc -c < hello.prg) bytes)"
